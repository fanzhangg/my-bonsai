<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>修叶试剪 · 一盆树</title><link rel="stylesheet" href="/leaf-trimming.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5ee;color:#354d3f;font:14px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px;min-height:100svh;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:24px;font-weight:500;margin:0}header p{color:#869080;font-size:12px;margin:0}a{color:inherit}#sample{flex:1;height:65svh;min-height:300px}#sample svg{width:100%;height:100%;max-height:660px}button,select{min-height:44px;border:1px solid #667b5430;border-radius:24px;background:transparent;color:inherit;padding:10px 18px;font:inherit;cursor:pointer}button.primary{background:#3f624d;color:#fff;border:0;padding:12px 32px}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}#note{text-align:center;font-size:12px;color:#788573}footer{text-align:center;font-size:12px;color:#85907e;margin-top:12px}@media(max-width:600px){main{padding:18px}h1{font-size:21px}#sample{height:58svh}.actions{gap:7px}button,select{padding:9px 13px}}
