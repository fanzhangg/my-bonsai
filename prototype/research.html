<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f1e8"><title>树冠实验</title><link rel="stylesheet" href="/study.css"><link rel="stylesheet" href="/canopy.css"></head>
<body><header><div><h1>树冠实验</h1><p>7 款造型 · 分层枝序 · 成组叶团</p></div><a href="/selection-v1.html">旧版选样 ↗</a></header>
<main><div class="tools"><div id="versions" class="segments" role="group" aria-label="查看方式"><button data-mode="new" aria-pressed="false">款式预览</button><button data-mode="looks" aria-pressed="true">配色对照</button><button data-mode="compare" aria-pressed="false">新旧对照</button></div><label class="style-filter">款式 <select id="preset"><option value="all">全部款式</option></select></label><label class="seed-label">种子 <input id="seed" value="BONSAI-01" maxlength="64"></label><button id="shuffle">换一批</button></div>
<section class="appearance-panel" aria-label="视觉方案"><div id="looks" class="look-buttons" role="group" aria-label="整套搭配"></div><details class="mix"><summary>单独搭配 <span id="appearance-name">原色</span></summary><div class="mix-grid"><label>叶片形状<select id="look-shape"></select></label><label>叶片颜色<select id="look-foliage"></select></label><label>树干颜色<select id="look-bark"></select></label><label>画面背景<select id="look-background"></select></label></div></details></section>
<div class="viewbar"><div id="views" class="segments" role="group" aria-label="显示方式"><button data-view="foliage" aria-pressed="true">枝叶</button><button data-view="silhouette" aria-pressed="false">轮廓</button><button data-view="skeleton" aria-pressed="false">裸枝</button></div><label class="time">展开 <input id="time" type="range" min="0" max="96" value="96" step="4"><output id="hour">96h</output></label></div>
<section id="gallery" class="gallery" aria-label="树冠样本"></section>
<section class="shortlist"><div class="section-title"><h2>候选 <span id="count">0</span></h2><div class="actions"><button id="export" disabled>导出参数</button></div></div><div id="chosen"></div></section>
<details class="references"><summary>实验说明</summary><p>配色对照固定树形、种子和画幅，只更换叶形与色彩。六套搭配可用于所有款式，是视觉实验，不代表对应树种的季节变化。单独搭配可自由组合叶形、叶色、树干与背景，保存候选时一并记录。</p><p>新旧对照使用同种子、同主干与同画幅；旧版保留原有外观。斜干松使用由直干参考变换得到的共同骨架。新方案按冠区分配二、三级枝，以成组叶簇构成树冠；榉树另外把放射主枝重组为分级骨架。时间轴展示预生成枝叶的展开，尚未模拟生理生长。</p><p>候选自动保存在本机；旧版候选保留在“旧版选样”。</p><p><a href="https://www.bonsaiempire.com/basics/styling/developmental-exhibitive-wiring" target="_blank" rel="noreferrer">真实叶层参考</a> · <a href="https://algorithmicbotany.org/papers/bonsai.eg2003.html" target="_blank" rel="noreferrer">多尺度盆景建模</a></p></details></main>
<dialog id="editor"><div class="dialog-top"><h2 id="editor-title"></h2><button id="close" aria-label="关闭参数编辑">关闭</button></div><div class="editor-grid"><div id="preview"></div><div class="parameters"><label>整套配色<select id="edit-look"><option value="custom" disabled>自选搭配</option></select></label><div id="sliders"></div><p id="edit-summary"></p><div class="actions"><button id="restore">恢复默认</button><button id="pick-edit" class="primary">加入候选</button></div></div></div></dialog>
<div id="status" role="status" aria-live="polite"></div><script type="module" src="/canopy-study.mjs"></script></body></html>
