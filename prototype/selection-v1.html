<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f1e8"><title>盆景选样</title><link rel="stylesheet" href="/study.css"></head><body>
<header><div><h1>盆景选样</h1><p>6 款树形 · 3 种生长策略</p></div><div class="actions"><button id="import">导入候选</button><button id="export" disabled>导出选择</button><input id="file" type="file" accept="application/json,.json" hidden></div></header>
<main><div class="tools"><label>款式 <select id="preset"><option value="all">全部款式</option></select></label><div id="strategies" class="segments" role="group" aria-label="生长策略"></div><label class="seed-label">种子 <input id="seed" maxlength="64" value="BONSAI-01"></label><button id="shuffle">换一批</button></div>
<div class="viewbar"><p id="strategy-note"></p><div><label><input id="skeleton" type="checkbox"> 仅枝干</label><label><input id="guides" type="checkbox"> 冠形范围</label></div><label class="time">生长 <input id="time" type="range" min="0" max="96" step="4" value="96"><output id="hour">96h</output></label></div>
<section id="gallery" class="gallery" aria-label="盆景样本"></section><section class="shortlist"><div class="section-title"><h2>候选 <span id="count">0</span></h2><span>选择保存在本机</span></div><div id="chosen"></div></section>
<details class="references"><summary>策略与参考</summary><div class="reference-grid"><div><h3>A · 枝序生长</h3><p>以父枝方向和分枝级数递归延伸，轮廓较自由。</p></div><div><h3>B · 冠形引导</h3><p>在向前的范围内引导新梢，限制局部树冠边界。</p></div><div><h3>C · 混合生长</h3><p>保留枝轴惯性，加入冠形偏好与枝梢空间避让。</p></div></div><p>三者共享初始骨架、种子和叶片绘制，可用“比较”隔离生长策略的差异。这是造型模拟实验，尚未选定最终算法。</p><p>款式与实物参考：<a href="https://www.bonsaiempire.com/origin/bonsai-styles" target="_blank" rel="noreferrer">Bonsai Empire 风格分类</a> · <a href="https://www.bonsai-nbf.org/japanese-collection" target="_blank" rel="noreferrer">美国国家盆景基金会 · 日本藏品</a> · <a href="https://www.bonsai-nbf.org/chinese-collection" target="_blank" rel="noreferrer">中国藏品</a>。选取常见代表款式，并非销量排名；树种名称表示视觉参考，不是生理模型。</p><a href="/workbench.html">旧工作台</a></details></main>
<dialog id="editor"><div class="dialog-top"><h2 id="editor-title"></h2><button id="close" aria-label="关闭参数编辑">关闭</button></div><div class="editor-grid"><div id="preview"></div><div class="parameters"><label>生长策略<select id="edit-strategy"></select></label><div id="sliders"></div><p id="edit-summary"></p><div class="actions"><button id="restore">恢复款式参数</button><button id="pick-edit" class="primary">加入候选</button></div></div></div></dialog><div id="status" role="status" aria-live="polite"></div><script type="module" src="/study.mjs"></script></body></html>
