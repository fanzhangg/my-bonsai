<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf9f3"><title>一盆树</title><link rel="stylesheet" href="/mvp.css"><link rel="stylesheet" href="/weather.css"><link rel="stylesheet" href="/visitors.css"></head>
<body><main><button id="copy" class="copy" aria-label="复制链接" title="复制链接" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/></svg></button>
<a id="new-tree" class="copy new-tree" href="/" aria-label="领养新树" title="领养新树" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
<div id="weather-sky" aria-hidden="true"></div><div id="weather-haze" aria-hidden="true"></div><canvas id="weather-effects" aria-hidden="true"></canvas>
<div id="stage" aria-label="盆栽"></div>
<div id="insect-layer" role="group" aria-label="植物周围的小访客" tabindex="-1"></div>
<div id="welcome" hidden><button id="claim" class="primary">认领这棵树</button></div>

<p id="status" role="status" hidden></p><button id="retry" hidden>重试</button>
<section id="debug" hidden aria-label="调试模式"><div class="debug-heading"><strong>Debug</strong><a id="exit">退出</a></div><p>本地预览，不改变已保存的树。</p>
<label>树形<select id="preset"></select></label><label>外观<select id="look"></select></label>
<label>种子<input id="seed" maxlength="64"></label><button id="random">随机样本</button>
<label>认领后时间 <output id="age"></output><input id="time" type="range" min="0" max="168" step="0.5" value="0"></label>
<div class="actions"><button data-hours="4">+4 小时</button><button data-hours="24">+1 天</button><button id="replay">重播</button><button id="reset">恢复真实状态</button></div><pre id="info"></pre>
<div id="weather-controls" hidden><hr><label>天气<select id="weather-kind"><option value="live">实时天气</option><option value="clear">晴天</option><option value="cloudy">阴天</option><option value="rain">雨天</option><option value="snow">雪天</option><option value="fog">雾天</option><option value="wind">大风</option><option value="storm">雷雨</option></select></label><label>当地时刻 <output id="weather-hour-value">实时</output><input id="weather-hour" type="range" min="0" max="23.9" step="0.1" value="12"></label><button id="weather-live">恢复实时天气</button><pre id="weather-info"></pre></div></section>
<a id="weather-credit" href="https://open-meteo.com/" target="_blank" rel="noreferrer" hidden aria-label="天气数据来自 Open-Meteo">Open-Meteo</a>
</main><script type="module" src="/mvp.mjs"></script></body></html>
