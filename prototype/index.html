<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf9f3"><title>我的盆栽</title><link rel="stylesheet" href="/mvp.css"><link rel="stylesheet" href="/weather.css"><link rel="stylesheet" href="/visitors.css"><link rel="stylesheet" href="/pruning.css"><link rel="stylesheet" href="/design-system-watering.css"><link rel="stylesheet" href="/watering.css"><link rel="stylesheet" href="/text-input.css"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="/i18n.css"></head>
<body><label class="language-picker"><select id="language" aria-label="语言" data-i18n-aria-label="语言"><option value="auto" data-i18n="跟随浏览器">跟随浏览器</option><option value="zh" lang="zh-CN">中文</option><option value="en" lang="en">English</option></select></label><main><button id="share" class="copy" type="button" aria-label="分享我的盆栽" data-i18n-aria-label="分享我的盆栽" title="分享我的盆栽" data-i18n-title="分享我的盆栽" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 12 6-5M9 12l6 5"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="5" r="3"/><circle cx="18" cy="19" r="3"/></svg></button>
<a class="copy gallery-link" href="/gallery" aria-label="进入盆栽小院" data-i18n-aria-label="进入盆栽小院" title="盆栽小院" data-i18n-title="盆栽小院"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></a>
<button id="regenerate" class="copy" type="button" aria-label="重新生成植株" data-i18n-aria-label="重新生成植株" title="重新生成植株" data-i18n-title="重新生成植株" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 6.1A8 8 0 0 1 19.7 10M4.3 14A8 8 0 0 0 17.9 17.9"/></svg></button>
<a id="new-tree" class="copy new-tree" href="/" aria-label="领养新树" data-i18n-aria-label="领养新树" title="领养新树" data-i18n-title="领养新树" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
<div id="weather-sky" aria-hidden="true"></div><div id="weather-haze" aria-hidden="true"></div><canvas id="weather-effects" aria-hidden="true"></canvas>
<h1 id="tree-name" hidden></h1>
<div id="stage" aria-label="盆栽" data-i18n-aria-label="盆栽"></div>
<div id="insect-layer" role="group" aria-label="植物周围的小访客" data-i18n-aria-label="植物周围的小访客" tabindex="-1"></div>
<div id="live-pruning" hidden><p id="pruning-message" class="pruning-sr-only" role="status" aria-live="polite"><span data-i18n="拿起剪刀，慢慢靠近一根旁支。">拿起剪刀，慢慢靠近一根旁支。</span></p>
      <button id="pruning-scissors" class="pruning-scissors" type="button" aria-label="拖动剪刀剪下旁支；也可按空格拿起，用方向键选择，再按空格剪下" data-i18n-aria-label="拖动剪刀剪下旁支；也可按空格拿起，用方向键选择，再按空格剪下" aria-describedby="pruning-message">
        <svg viewBox="-54 -54 108 108" aria-hidden="true" data-tool-shape="butterfly-pruning">
          <g class="scissor-half scissor-a">
            <path d="M0 -38 C-12 -32 -16 -17 -10 -4 L3 8 L11 1 C6 -10 2 -26 0 -38Z" fill="#88968d"/>
            <path d="M0 -37 Q-3 -22 3 -4 L6 0" fill="none" stroke="#d5ddd4" stroke-width="2"/>
            <path d="M4 3 C15 4 34 9 39 24 C45 40 29 48 17 39 C7 31 4 18 4 3Z" fill="none" stroke="#344c40" stroke-width="6.5" stroke-linejoin="round"/>
          </g>
          <g class="scissor-half scissor-b">
            <path d="M0 -38 C12 -32 16 -17 10 -4 L-3 8 L-11 1 C-6 -10 -2 -26 0 -38Z" fill="#bdc7bc"/>
            <path d="M0 -37 Q3 -22 -3 -4 L-6 0" fill="none" stroke="#ebeee3" stroke-width="2"/>
            <path d="M-4 3 C-15 4 -34 9 -39 24 C-45 40 -29 48 -17 39 C-7 31 -4 18 -4 3Z" fill="none" stroke="#405c49" stroke-width="6.5" stroke-linejoin="round"/>
          </g>
          <circle r="5" fill="#8e9885" stroke="#d8d8bb" stroke-width="1"/>
          <path d="M-2 -2 L2 2" stroke="#46594d" stroke-width="1.5"/>
        </svg>
      </button>
</div>
<div id="live-watering" hidden><svg id="watering-water" class="watering-water" aria-hidden="true"></svg><p id="watering-status" class="watering-sr-only" role="status" aria-live="polite"><span data-i18n="拿起水壶，靠近盆栽浇水。">拿起水壶，靠近盆栽浇水。</span></p>      <button id="watering-can" class="watering-can" aria-label="拖动水壶到花盆附近浇水，浇水时可继续移动；也可按空格拿起，方向键移动" data-i18n-aria-label="拖动水壶到花盆附近浇水，浇水时可继续移动；也可按空格拿起，方向键移动" aria-describedby="watering-status">
        <svg viewBox="-60 -55 120 110" aria-hidden="true">
          <g class="watering-facing"><g class="watering-vessel">
            <path d="M19 -17 C51 -27 55 14 26 20" fill="none" stroke="#768b77" stroke-width="8"/>
            <path d="M-17 11 L-42 -15 L-48 -11 L-30 22 L-14 24Z" fill="#8b9d89"/>
            <path d="M-49 -22 L-39 -15 L-45 -6 L-55 -13Z" fill="#b7bca7"/>
            <path class="watering-nozzle-water" d="M-49 -20 L-52 -13 L-46 -9 L-42 -15Z" fill="#78afc6"/>
            <path d="M-25 -17 Q-29 -17 -28 -10 L-24 29 Q0 39 25 29 L29 -10 Q30 -17 25 -17Z" fill="#839780"/>
            <ellipse cy="-17" rx="26" ry="6" fill="#a9b69e"/>
            <ellipse cy="-18" rx="16" ry="3" fill="#5f7565"/>
            <ellipse class="watering-nozzle-water" cy="-18" rx="16" ry="3" fill="#78afc6"/>
          </g></g>
        </svg>
      </button></div>
<div id="welcome" hidden><label class="name-field" for="claim-name"><input id="claim-name" class="text-input" type="text" aria-label="盆栽名字（选填，最多 30 个字符）" data-i18n-aria-label="盆栽名字（选填，最多 30 个字符）" placeholder="我的名字是..." data-i18n-placeholder="我的名字是..." autocomplete="off"></label><button id="claim" class="primary"><span data-i18n="认领我">认领我</span></button></div>

<p id="status" role="status" hidden></p><button id="retry" hidden><span data-i18n="重试">重试</span></button>
<section id="debug" hidden aria-label="作弊模式" data-i18n-aria-label="作弊模式"><div class="debug-heading"><strong><span data-i18n="作弊模式">作弊模式</span></strong><a id="exit"><span data-i18n="退出">退出</span></a></div><p><span data-i18n="这里是尚未保存的预览。更换树形、种子、变化幅度或枝量会重新生成枝干并清空剪枝，可撤回；调整冠型、叶形或配色保留剪枝。">这里是尚未保存的预览。更换树形、种子、变化幅度或枝量会重新生成枝干并清空剪枝，可撤回；调整冠型、叶形或配色保留剪枝。</span></p>
<label><span data-i18n="树形">树形</span><select id="preset"></select></label><label><span data-i18n="外观">外观</span><select id="look"></select></label>
<div id="design-controls" hidden><label><span data-i18n="冠型">冠型</span><select id="design-crown"></select></label><label><span data-i18n="叶形">叶形</span><select id="design-leaf"></select></label><label><span data-i18n="配色">配色</span><select id="design-palette"></select></label><label><span data-i18n="变化幅度">变化幅度</span><select id="design-variation"><option value="0.25" data-i18n="克制">克制</option><option value="0.55" data-i18n="自然">自然</option><option value="0.85" data-i18n="鲜明">鲜明</option></select></label><label><span data-i18n="枝量">枝量</span><select id="design-density"><option value="0.2" data-i18n="疏朗">疏朗</option><option value="0.5" data-i18n="均衡">均衡</option><option value="0.8" data-i18n="丰茂">丰茂</option></select></label></div>
<label><span data-i18n="种子">种子</span><input id="seed" maxlength="64"></label><button id="random"><span data-i18n="随机样本">随机样本</span></button>
<label><span data-i18n="预览时间 · 认领后">预览时间 · 认领后</span><output id="age"></output><input id="time" type="range" min="0" max="168" step="0.5" value="0"></label>
<p id="growth-summary" role="status"></p><p id="timeline-note"></p><button id="branch-timeline" hidden><span data-i18n="从当前时刻继续（移除后续操作）">从当前时刻继续（移除后续操作）</span></button>
<div class="actions"><button data-hours="1"><span data-i18n="+1 小时">+1 小时</span></button><button data-hours="12"><span data-i18n="+12 小时 · 看新枝">+12 小时 · 看新枝</span></button><button data-hours="24"><span data-i18n="+1 天">+1 天</span></button><button id="replay"><span data-i18n="重播当前树形">重播当前树形</span></button><button id="undo-draft" disabled><span data-i18n="撤回上一步">撤回上一步</span></button><button id="reset"><span data-i18n="重新载入已保存状态">重新载入已保存状态</span></button></div>
<p id="cheat-status" role="status" aria-live="polite"></p><button id="save-cheat" class="primary"><span data-i18n="保存到这棵树">保存到这棵树</span></button><pre id="info"></pre>
<div id="weather-controls" hidden><hr><p><span data-i18n="天气和当地时刻仅供预览，不随树保存。">天气和当地时刻仅供预览，不随树保存。</span></p><label><span data-i18n="天气">天气</span><select id="weather-kind"><option value="live" data-i18n="实时天气">实时天气</option><option value="clear" data-i18n="晴天">晴天</option><option value="cloudy" data-i18n="阴天">阴天</option><option value="rain" data-i18n="雨天">雨天</option><option value="snow" data-i18n="雪天">雪天</option><option value="fog" data-i18n="雾天">雾天</option><option value="wind" data-i18n="大风">大风</option><option value="storm" data-i18n="雷雨">雷雨</option></select></label><label><span data-i18n="当地时刻">当地时刻</span><output id="weather-hour-value"><span data-i18n="实时">实时</span></output><input id="weather-hour" type="range" min="0" max="23.9" step="0.1" value="12"></label><button id="weather-live"><span data-i18n="恢复实时天气">恢复实时天气</span></button><pre id="weather-info"></pre></div></section>
<a id="weather-credit" href="https://open-meteo.com/" target="_blank" rel="noreferrer" hidden aria-label="天气数据来自 Open-Meteo" data-i18n-aria-label="天气数据来自 Open-Meteo">Open-Meteo</a>
</main><script type="module" src="/mvp.mjs"></script></body></html>
