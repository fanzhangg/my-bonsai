<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf9f3"><title>一盆树</title><link rel="stylesheet" href="/mvp.css"><link rel="stylesheet" href="/weather.css"><link rel="stylesheet" href="/visitors.css"><link rel="stylesheet" href="/pruning.css"><link rel="stylesheet" href="/design-system-watering.css"><link rel="stylesheet" href="/watering.css"></head>
<body><main><button id="share" class="copy" type="button" aria-label="分享我的盆栽" title="分享我的盆栽" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 12 6-5M9 12l6 5"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="5" r="3"/><circle cx="18" cy="19" r="3"/></svg></button>
<a class="copy gallery-link" href="/gallery" aria-label="进入盆栽小院" title="盆栽小院"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></a>
<button id="regenerate" class="copy" type="button" aria-label="重新生成植株" title="重新生成植株" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 6.1A8 8 0 0 1 19.7 10M4.3 14A8 8 0 0 0 17.9 17.9"/></svg></button>
<a id="new-tree" class="copy new-tree" href="/" aria-label="领养新树" title="领养新树" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
<div id="weather-sky" aria-hidden="true"></div><div id="weather-haze" aria-hidden="true"></div><canvas id="weather-effects" aria-hidden="true"></canvas>
<div id="stage" aria-label="盆栽"></div>
<div id="insect-layer" role="group" aria-label="植物周围的小访客" tabindex="-1"></div>
<div id="live-pruning" hidden><p id="pruning-message" class="pruning-sr-only" role="status" aria-live="polite">拿起剪刀，慢慢靠近一根旁支。</p>
      <button id="pruning-scissors" class="pruning-scissors" type="button" aria-label="拖动剪刀剪下旁支；也可按空格拿起，用方向键选择，再按空格剪下" aria-describedby="pruning-message">
        <svg viewBox="-54 -54 108 108" aria-hidden="true" fill="currentColor">
          <g class="scissor-half scissor-a">
            <path d="M0 -43 Q-10 -30 -6 -5 L17 22 L21 18 L5 -3 Z" fill="#a4afa7"/>
            <path d="M13 17 C20 12 30 19 32 29 C35 41 29 48 21 45 C13 43 8 32 9 24 C9 21 11 19 13 17 Z M17 23 C13 25 16 36 22 39 C27 42 29 36 27 30 C25 23 21 20 17 23 Z" fill-rule="evenodd"/>
          </g>
          <g class="scissor-half scissor-b">
            <path d="M0 -43 Q10 -30 6 -5 L-17 22 L-21 18 L-5 -3 Z" fill="#c5cdc3"/>
            <path d="M-13 17 C-20 12 -30 19 -32 29 C-35 41 -29 48 -21 45 C-13 43 -8 32 -9 24 C-9 21 -11 19 -13 17 Z M-17 23 C-13 25 -16 36 -22 39 C-27 42 -29 36 -27 30 C-25 23 -21 20 -17 23 Z" fill-rule="evenodd"/>
          </g>
          <circle r="4" fill="#b49a70"/>
        </svg>
      </button>
</div>
<div id="live-watering" hidden><svg id="watering-water" class="watering-water" aria-hidden="true"></svg><p id="watering-status" class="watering-sr-only" role="status" aria-live="polite">拿起水壶，靠近盆栽浇水。</p>      <button id="watering-can" class="watering-can" aria-label="拖动水壶到花盆附近浇水，浇水时可继续移动；也可按空格拿起，方向键移动" aria-describedby="watering-status">
        <svg viewBox="-60 -55 120 110" aria-hidden="true">
          <g class="watering-facing"><g class="watering-vessel">
            <path d="M19 -17 C51 -27 55 14 26 20" fill="none" stroke="#768b77" stroke-width="8"/>
            <path d="M-17 11 L-42 -15 L-48 -11 L-30 22 L-14 24Z" fill="#8b9d89"/>
            <path d="M-49 -22 L-39 -15 L-45 -6 L-55 -13Z" fill="#b7bca7"/>
            <path class="watering-nozzle-water" d="M-49 -20 L-52 -13 L-46 -9 L-42 -15Z" fill="#78afc6"/>
            <path d="M-25 -17 Q-29 -17 -28 -10 L-24 29 Q0 39 25 29 L29 -10 Q30 -17 25 -17Z" fill="#839780"/>
            <ellipse cy="-17" rx="26" ry="6" fill="#a9b69e"/>
            <ellipse cy="-18" rx="16" ry="3" fill="#5f7565"/>
            <ellipse class="watering-nozzle-water" cy="-18" rx="16" ry="3" fill="#78afc6"/>
          </g></g>
        </svg>
      </button></div>
<div id="welcome" hidden><button id="claim" class="primary">认领这棵树</button></div>

<p id="status" role="status" hidden></p><button id="retry" hidden>重试</button>
<section id="debug" hidden aria-label="作弊模式"><div class="debug-heading"><strong>作弊模式</strong><a id="exit">退出</a></div><p>这里是尚未保存的预览。更换树形、种子、变化幅度或枝量会重新生成枝干并清空剪枝，可撤回；调整冠型、叶形或配色保留剪枝。</p>
<label>树形<select id="preset"></select></label><label>外观<select id="look"></select></label>
<div id="design-controls" hidden><label>冠型<select id="design-crown"></select></label><label>叶形<select id="design-leaf"></select></label><label>配色<select id="design-palette"></select></label><label>变化幅度<select id="design-variation"><option value="0.25">克制</option><option value="0.55">自然</option><option value="0.85">鲜明</option></select></label><label>枝量<select id="design-density"><option value="0.2">疏朗</option><option value="0.5">均衡</option><option value="0.8">丰茂</option></select></label></div>
<label>种子<input id="seed" maxlength="64"></label><button id="random">随机样本</button>
<label>预览时间 · 认领后 <output id="age"></output><input id="time" type="range" min="0" max="168" step="0.5" value="0"></label>
<p id="growth-summary" role="status"></p><p id="timeline-note"></p><button id="branch-timeline" hidden>从当前时刻继续（移除后续操作）</button>
<div class="actions"><button data-hours="1">+1 小时</button><button data-hours="12">+12 小时 · 看新枝</button><button data-hours="24">+1 天</button><button id="replay">重播当前树形</button><button id="undo-draft" disabled>撤回上一步</button><button id="reset">重新载入已保存状态</button></div>
<p id="cheat-status" role="status" aria-live="polite"></p><button id="save-cheat" class="primary">保存到这棵树</button><pre id="info"></pre>
<div id="weather-controls" hidden><hr><p>天气和当地时刻仅供预览，不随树保存。</p><label>天气<select id="weather-kind"><option value="live">实时天气</option><option value="clear">晴天</option><option value="cloudy">阴天</option><option value="rain">雨天</option><option value="snow">雪天</option><option value="fog">雾天</option><option value="wind">大风</option><option value="storm">雷雨</option></select></label><label>当地时刻 <output id="weather-hour-value">实时</output><input id="weather-hour" type="range" min="0" max="23.9" step="0.1" value="12"></label><button id="weather-live">恢复实时天气</button><pre id="weather-info"></pre></div></section>
<a id="weather-credit" href="https://open-meteo.com/" target="_blank" rel="noreferrer" hidden aria-label="天气数据来自 Open-Meteo">Open-Meteo</a>
</main><script type="module" src="/mvp.mjs"></script></body></html>
