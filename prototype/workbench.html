<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f2e9"><title>盆栽算法</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header class="toolbar"><h1>盆栽算法</h1><div class="file-actions"><button id="export-previous" hidden>导出原时间线</button><button id="export">导出</button><button id="import">导入</button><button id="reset">重置</button></div><input type="file" id="import-file" accept="application/json,.json" hidden></header>
<main class="workspace">
  <section class="specimen" aria-label="盆栽生长预览">
    <div class="style-picker segmented" role="group" aria-label="盆景风格"><button id="moyogi" aria-pressed="true">曲干</button><button id="literati" aria-pressed="false">文人</button><button id="cascade" aria-pressed="false">悬崖</button><button id="legacy" aria-pressed="false">旧模型</button></div><div class="stats"><span><strong id="branch-count">0</strong> 枝</span><span><strong id="bud-count">0</strong> 休眠芽</span><span><strong id="cut-count">0</strong> 刀</span><span id="render-time"></span></div>
    <div class="canvas-wrap" id="canvas-wrap">
      <svg id="tree" viewBox="0 0 500 540" role="img" aria-label="可选择枝条的盆栽，点选后可确认剪下">
          <defs><radialGradient id="aura"><stop stop-color="#dfe6cb" stop-opacity=".65"/><stop offset="1" stop-color="#f6f4eb" stop-opacity="0"/></radialGradient><linearGradient id="pot" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#99887c"/><stop offset="1" stop-color="#6d5d55"/></linearGradient><linearGradient id="rim"><stop stop-color="#a69586"/><stop offset="1" stop-color="#7c6b61"/></linearGradient><filter id="shadow"><feGaussianBlur stdDeviation="5"/></filter></defs>
          <ellipse cx="252" cy="256" rx="220" ry="218" fill="url(#aura)"/>
          <path id="ground" d="M45 483 H455" stroke="#deded0" stroke-width=".7"/>
          <ellipse id="ground-shadow" cx="251" cy="514" rx="94" ry="9" fill="#62594b" opacity=".13" filter="url(#shadow)"/>
          <g id="viewport"><g id="guide-layer"></g><g id="ghost-layer"></g><g id="branch-layer"></g><g id="leaf-layer"></g><g id="scar-layer"></g><g id="bud-layer"></g><g id="hit-layer"></g></g>
          <g id="pot-layer" aria-hidden="true"><path d="M164 467 L178 504 Q250 517 321 504 L336 467Z" fill="url(#pot)"/><path d="M184 503 L184 512 L201 512 L203 507 M299 507 L301 512 L318 512 L318 503" fill="#66564e"/><ellipse cx="250" cy="467" rx="87" ry="17" fill="url(#rim)"/><ellipse cx="250" cy="464" rx="78" ry="11" fill="#524c3d"/><path d="M185 463 Q208 451 236 460 Q256 449 281 458 Q302 454 316 465 Q244 474 185 463" fill="#6e7950"/><ellipse cx="218" cy="464" rx="14" ry="3" fill="#89935f"/><path d="M248 449 Q251 461 269 467 M250 451 Q245 461 230 465" fill="none" stroke="#655641" stroke-width="4" stroke-linecap="round"/><path d="M180 479 Q248 491 320 479" fill="none" stroke="#b2a08d" opacity=".35"/></g>
        </svg>
      <div class="view-tools"><button id="zoom-out" aria-label="缩小树形">−</button><button id="zoom-reset" aria-label="重置视角">全树</button><button id="zoom-in" aria-label="放大树形">＋</button></div>
    </div>
    <div id="selection" class="selection" hidden><div><strong id="selected-name"></strong><p id="selected-info"></p><small id="branch-notice" hidden></small></div><div class="selection-actions"><button id="cancel-cut">取消</button><button id="confirm-cut" class="danger">剪下</button></div></div>
    <div id="candidates" class="candidates" hidden></div>
    <div class="time-panel"><div class="time-heading"><strong id="age">0 小时</strong><div class="time-buttons"><button id="replay">从头回放</button><button id="now" hidden>时间线终点</button><button id="play" class="primary" aria-label="播放生长">播放</button></div></div><input id="timeline" aria-label="生长时间轴" type="range" min="0" max="96" step="0.5" value="0"><div class="time-marks"></div><div class="time-actions"><label for="speed">速度</label><select id="speed"><option value="4">4 小时/秒</option><option value="8" selected>8 小时/秒</option><option value="16">16 小时/秒</option></select><div class="jump-group"><button data-jump="4">+4 小时</button><button data-jump="24">+1 天</button></div></div><div id="event-ticks" class="event-ticks"></div></div>
  </section>
  <aside class="controls" aria-label="算法参数">
    <section class="control-section" id="legacy-model" hidden><h2>模型</h2><div class="segmented" role="group" aria-label="生长算法"><button id="adaptive" class="active" aria-pressed="true">芽竞争</button><button id="baseline" aria-pressed="false">规则分叉</button></div></section>
    <section class="control-section"><div class="section-head"><label for="seed">种子</label><button id="new-seed">随机</button></div><div class="seed-row"><input id="seed" value="MOSS-0826" maxlength="64" aria-label="树的随机种子"><button id="apply-seed" aria-label="应用种子">应用</button></div><label class="slider-label" for="dominance">顶端优势 <output id="dominance-value">55%</output></label><input id="dominance" type="range" min="0" max="1" step="0.05" value="0.55"><label class="slider-label" for="light">光照方向 <output id="light-value">左 25°</output></label><input id="light" type="range" min="-65" max="65" step="5" value="-25"><label class="slider-label" for="randomness">自然微扰 <output id="randomness-value">65%</output></label><input id="randomness" type="range" min="0" max="1" step="0.05" value="0.65"><p class="hint">修改参数将重置实验。</p></section>
    <details class="control-section" id="style-debug"><summary>造型调试</summary><label class="slider-label" for="movement">走势幅度 <output id="movement-value">1.00</output></label><input id="movement" type="range" min="0.5" max="1.5" step="0.05" value="1"><label class="slider-label" for="taper">收尖 <output id="taper-value">1.00</output></label><input id="taper" type="range" min="0.6" max="1.5" step="0.05" value="1"><label class="slider-label" for="density">枝叶密度 <output id="density-value">0.65</output></label><input id="density" type="range" min="0.2" max="1" step="0.05" value="0.65"><label class="toggle"><input type="checkbox" id="guidance" checked><span>造型约束</span></label><label class="toggle"><input type="checkbox" id="guides"><span>冠形与留白范围</span></label></details><section class="control-section"><h2>显示</h2><label class="toggle"><input type="checkbox" id="compare"><span>未修剪对照</span></label><label class="toggle"><input id="buds" type="checkbox"><span>芽点</span></label><label class="toggle"><input id="skeleton" type="checkbox"><span>仅枝干</span></label></section>
  <section class="control-section"><button id="load-legacy">读取原来的实验</button></section></aside>
</main><div id="toast" role="status" aria-live="polite"></div><script type="module" src="/app.mjs"></script>
</body></html>
